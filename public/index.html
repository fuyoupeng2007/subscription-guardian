<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>订阅管家 · Subscription Guardian</title>
<style>
  :root{
    --bg1:#0b1120; --bg2:#151e33;
    --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
    --txt:#e6edf7; --muted:#93a4c0; --accent:#6ea8ff; --accent2:#8b5cf6;
    --gold:#fbbf24; --ok:#34d399; --warn:#fb7185;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--txt);
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 85% -10%, #1d3a63cc, transparent 60%),
      radial-gradient(800px 500px at -5% 110%, #7c3aed33, transparent 55%),
      linear-gradient(165deg,var(--bg1),#0f172a 70%);
    padding:0 0 60px;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header{padding:34px 0 8px;text-align:center}
  h1{font-size:30px;letter-spacing:.02em}
  h1 .dot{color:var(--gold)}
  .sub{color:var(--muted);margin-top:6px;font-size:14px}
  .badge{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:999px;font-size:12px;
    background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:var(--gold)}
  .badge.user{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35);color:var(--ok)}

  /* 标签 */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 18px}
  .tab{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;
    color:var(--muted);cursor:pointer;font-size:14px;transition:.18s}
  .tab:hover{color:var(--txt);border-color:#3a4a66}
  .tab.active{background:linear-gradient(135deg,rgba(110,168,207,.25),rgba(139,92,246,.2));
    border-color:rgba(110,168,207,.55);color:#fff;font-weight:600}

  .panel{display:none;animation:fade .3s ease}
  .panel.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .stat .v{font-size:30px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12px;margin-top:5px}
  .stat.hot .v{color:var(--gold)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  .card h3{font-size:15px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed rgba(255,255,255,.06)}
  .row:last-child{border:none}
  .row b{color:var(--gold)}

  .bar-row{display:grid;grid-template-columns:84px 1fr 52px;gap:12px;align-items:center;margin-bottom:9px}
  .bar-label{font-size:12px;color:#cbd5e1}.bar-label small{color:var(--muted);display:block}
  .bar-track{height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:999px}

  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
  input[type=text],input[type=number],textarea{width:100%;padding:11px 13px;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:14px;outline:none}
  textarea{min-height:72px;resize:vertical}
  input:focus,textarea:focus{border-color:var(--accent)}
  button.btn{display:inline-block;margin:12px 0 8px;padding:11px 22px;border:none;border-radius:12px;cursor:pointer;
    font-size:14px;font-weight:600;color:#0b1120;
    background:linear-gradient(135deg,#6ea8cf,#8b5cf6);transition:.18s}
  button.btn:hover{filter:brightness(1.1)}
  button.gold{background:linear-gradient(135deg,#fbbf24,#f97316)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .out{margin-top:12px;padding:14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);
    white-space:pre-wrap;line-height:1.6;font-size:14px;max-height:420px;overflow:auto}
  .out.spin{color:var(--muted);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .hint{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}
  .framebox{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:#0f172a}
  iframe{width:100%;height:100%;border:0;border-radius:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;margin-right:6px}
  .pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
  .pill.no{background:rgba(251,113,133,.15);color:var(--warn)}
  .pill.warn{background:rgba(251,191,36,.15);color:var(--gold)}
</style>
</head>
<body>
<header class="wrap">
  <h1>订阅管家 <span class="dot">·</span> Subscription Guardian</h1>
  <div class="sub">帮你管订阅、省会员钱、真联网查「哪首歌/剧在哪个会员能听」的中文 AI 助手</div>
  <div id="srcBadge" class="badge">…</div>
</header>

<div class="wrap">
  <nav class="tabs">
    <button class="tab active" data-p="overview">📊 总览</button>
    <button class="tab" data-p="report">📄 分析报告</button>
    <button class="tab" data-p="research">🔎 真实调研</button>
    <button class="tab" data-p="recommend">🧭 按爱好推荐</button>
    <button class="tab" data-p="chat">💬 AI 对话</button>
    <button class="tab" data-p="watch">⏰ 续费提醒</button>
  </nav>

  <!-- 总览 -->
  <section id="p-overview" class="panel on">
    <div id="ov"></div>
  </section>

  <!-- 报告 -->
  <section id="p-report" class="panel">
    <div class="card">
      <h3>一键生成分析报告</h3>
      <div class="btn-row">
        <button class="btn" id="btnReport" onclick="genReport()">生成报告</button>
        <button class="btn gold" id="btnReportM" onclick="genReport(true)">多智能体报告（分析+复核，较慢）</button>
      </div>
      <iframe id="reportFrame" class="framebox" style="display:none"></iframe>
    </div>
  </section>

  <!-- 调研 -->
  <section id="p-research" class="panel">
    <div class="card">
      <h3>真联网查「歌/剧在哪个会员能听」</h3>
      <input type="text" id="rq" placeholder="例如：七里香 / 周杰伦 / 夏目友人帐" onkeydown="if(event.key==='Enter')research()" />
      <button class="btn" onclick="research()">去查</button>
      <div class="out" id="rOut"></div>
      <div class="hint">实时访问网易云音乐 / QQ音乐 / B站 公开搜索接口，无需任何 key，国内直连。</div>
    </div>
  </section>

  <!-- 推荐 -->
  <section id="p-recommend" class="panel">
    <div class="card">
      <h3>按你的爱好 + 预算，推荐该开哪些会员</h3>
      <label>你的爱好（用逗号分隔，可填：嘻哈/流行/二次元/热剧/日漫/电影/古典…）</label>
      <input type="text" id="recInterests" placeholder="例如：嘻哈, 日漫, 电影" />
      <label>每月愿意花多少会员钱（元）</label>
      <input type="number" id="recBudget" value="50" />
      <button class="btn" onclick="recommend()">开始推荐</button>
      <div class="out" id="recOut"></div>
    </div>
  </section>

  <!-- 对话 -->
  <section id="p-chat" class="panel">
    <div class="card">
      <h3>和 AI 管家聊天（本地模型，免费离线）</h3>
      <textarea id="chatIn" placeholder="例如：分析一下我的订阅 / 模拟取消腾讯视频和芒果TV / 查一下晴天在哪个平台能听"></textarea>
      <button class="btn" onclick="chat()">发送</button>
      <div class="out" id="chatOut"><span style="color:var(--muted)">输入问题，回车对话开始。</span></div>
    </div>
  </section>

  <!-- 提醒 -->
  <section id="p-watch" class="panel">
    <div class="card">
      <h3>即将自动续费的订阅</h3>
      <button class="btn" onclick="watch()">查看最近提醒</button>
      <div class="out" id="wOut"></div>
    </div>
  </section>
</div>

<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Tab 切换
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    $('#p-'+b.dataset.p).classList.add('on');
  });

  async function post(path,body){
    const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    return r.json();
  }

  // 总览
  async function loadStatus(){
    const d=await post('/api/status',{});
    const badge=$('#srcBadge');
    if(d.dataSource && d.dataSource.isSample){ badge.textContent='当前为【示例数据】演示 · 接入真实数据见 datasources/'; badge.classList.remove('user'); }
    else if(d.dataSource){ badge.textContent='✅ 使用你的真实数据'; badge.classList.add('user'); }

    const bars=(d.categorySummary||[]).map(c=>{
      const w=Math.round(c.total/(Math.max(...(d.categorySummary||[]).map(x=>x.total),1))*100);
      return `<div class="bar-row"><div class="bar-label">${c.category}<small>${c.count}项</small></div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><b style="text-align:right">¥${c.total}</b></div>`;
    }).join('');
    const overlap=(d.overlaps||[]).map(o=>`
      <div class="row"><span>${esc(o.category)} · 建议取消 ${o.cancel.join('、')}</span><b class="gold">每月省 ¥${o.cancelMonthly}</b></div>`).join('')||'<span style="color:var(--muted)">无重叠</span>';
    const inc=(d.priceIncreases||[]).map(p=>`<div class="row"><span>${esc(p.name)}</span><b style="color:var(--warn)">${p.from}→${p.to}元</b></div>`).join('')||'<span style="color:var(--muted)">未发现涨价</span>';
    $('#ov').innerHTML=`
      <div class="grid">
        <div class="stat"><div class="v">${d.totalCount}</div><div class="l">付费订阅</div></div>
        <div class="stat"><div class="v">¥${d.totalMonthly}</div><div class="l">每月花费</div></div>
        <div class="stat"><div class="v">¥${d.totalYearly}</div><div class="l">每年花费</div></div>
        <div class="stat hot"><div class="v">¥${d.totalSavableMonthly}</div><div class="l">每月可省</div></div>
        <div class="stat hot"><div class="v">¥${d.totalSavableYearly}</div><div class="l">每年可省</div></div>
      </div>
      <div class="card"><h3>💳 分类支出</h3>${bars}</div>
      <div class="card"><h3>✂️ 重叠订阅（可省钱）</h3>${overlap}</div>
      <div class="card"><h3>📈 涨价提醒</h3>${inc}</div>`;
  }

  // 报告
  async function genReport(multi){
    const f=$('#reportFrame'); f.style.display='block'; f.srcdoc='<div style="color:#888;font-family:sans-serif;padding:30px">生成中…</div>';
    const d=await post('/api/report',{}); f.srcdoc=d.html;
  }

  // 调研
  async function research(){
    const q=$('#rq').value.trim(); if(!q)return;
    const o=$('#rOut'); o.className='out spin'; o.textContent='正在真实联网查询…';
    const d=await post('/api/research',{query:q}); o.className='out'; o.textContent=d.text;
  }

  // 推荐
  async function recommend(){
    const interests=$('#recInterests').value.split(/[,，、\s;]+/).filter(Boolean);
    const budget=$('#recBudget').value||50;
    const o=$('#recOut'); o.className='out spin'; o.textContent='根据你的爱好计算中…';
    const d=await post('/api/recommend',{interests,budget});
    o.className='out'; o.textContent=d.text;
  }

  // 对话
  async function chat(){
    const msg=$('#chatIn').value.trim(); if(!msg)return;
    const o=$('#chatOut');
    o.className='out spin'; o.textContent='🧠 本地模型思考中，约需 10~20 秒，请稍候…';
    const d=await post('/api/chat',{message:msg});
    o.className='out'; o.textContent=`（耗时 ${d.seconds} 秒，来自本地 Qwen）\n\n`+d.text;
  }

  // 提醒
  async function watch(){
    const d=await post('/api/status',{});
    const rows=(d.renewals||[]).map(r=>`<div class="row"><span>${esc(r.name)}</span><b>${esc(r.date)} 自动续费 ¥${r.price}</b></div>`).join('')||'<span style="color:var(--muted)">未来没有续费安排</span>';
    const sum=(d.renewals||[]).reduce((a,r)=>a+r.price,0);
    $('#wOut').className='out'; $('#wOut').innerHTML=`<div class="row"><span>共 ${(d.renewals||[]).length} 项</span><b>预计合计 ¥${sum}</b></div>${rows}`;
  }

  loadStatus();
</script>
</body>
</html>
